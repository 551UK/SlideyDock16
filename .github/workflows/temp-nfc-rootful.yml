name: Temporary NFCBackgroundEnabler rootful package build
on:
  push:
    branches:
      - temporary-nfc-rootful-build-20261102
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Set up build tools
        run: |
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
      - name: Download upstream source
        run: git clone --depth 1 https://github.com/arandomdev/NFCBackgroundEnabler.git nfc
      - name: Add missing Foundation and Substrate imports to legacy source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pre = '''#import <Foundation/Foundation.h>
          #import <substrate.h>
          #ifndef HBLogInfo
          #define HBLogInfo(...) NSLog(__VA_ARGS__)
          #endif
          #ifndef HBLogError
          #define HBLogError(...) NSLog(__VA_ARGS__)
          #endif
          #ifndef HBLogDebug
          #define HBLogDebug(...) NSLog(__VA_ARGS__)
          #endif
          '''
          paths = [
              'nfc/Tweak.xm',
              'nfc/NBETagLockProvider/NBETagLockProvider.mm',
              'nfc/nfcbackgroundenablerpreferences/NBEPRootListController.m'
          ]
          for path in paths:
              p = Path(path)
              p.write_text(pre + p.read_text())
          PY
      - name: Build original rootful package
        run: |
          set -euo pipefail
          cd nfc
          make clean package FINALPACKAGE=1 ARCHS="arm64 arm64e" TARGET="iphone:clang:latest:13.0" NFCBackgroundEnablerPreferences_PRIVATE_FRAMEWORKS="" NFCBackgroundEnablerPreferences_LDFLAGS="-undefined dynamic_lookup"
      - name: Validate deb and payload
        run: |
          set -euo pipefail
          deb="$(find nfc/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm"
          dpkg-deb -c "$deb"
          mkdir -p extracted
          dpkg-deb -x "$deb" extracted
          test -s extracted/Library/MobileSubstrate/DynamicLibraries/NFCBackgroundEnabler.dylib
          file extracted/Library/MobileSubstrate/DynamicLibraries/NFCBackgroundEnabler.dylib
      - name: Export deb without changing GitHub Releases
        uses: actions/upload-artifact@v4
        with:
          name: NFCBackgroundEnabler-rootful-deb
          path: nfc/packages/*.deb
          if-no-files-found: error
