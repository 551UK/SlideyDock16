name: Build and release SlideyDock16

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Check out SlideyDock16 source
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Build iOS 16 rootless deb (arm64 and arm64e)
        run: bash build.sh

      - name: Verify build and package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "uk.551.slideydock16"
          test "$(dpkg-deb -f "$deb" Version)" = "1.2.0-1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test -f dist/SHA256SUMS
          dylib="$(find .theos -name SlideyDock16.dylib -type f -print -quit)"
          test -n "$dylib"
          lipo -info "$dylib"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlideyDock16-rootless
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish deb to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.2.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.deb dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "SlideyDock16 v1.2.0 — iOS 16 rootless" \
              --notes "Rootless iOS 15–16 scrolling dock. Supports 100 dock apps with selectable 4 or 5 visible at once, plus page snapping or continuous swiping. Full source included in this repository. Rootless iOS 15-16; on-device verification recommended."
          fi
