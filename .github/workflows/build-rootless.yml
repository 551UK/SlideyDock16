name: Build and release SlideyDock16

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent outdated builds from publishing over the newest release.
concurrency:
  group: slideydock16-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Check out SlideyDock16 source
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Build iOS 16 rootless deb (arm64 and arm64e)
        run: bash build.sh

      - name: Verify build and package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "uk.551.slideydock16"
          test "$(dpkg-deb -f "$deb" Version)" = "1.3.0-1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test -f dist/SHA256SUMS
          dylib="$(find .theos -name SlideyDock16.dylib -type f -print -quit)"
          test -n "$dylib"
          lipo -info "$dylib"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlideyDock16-rootless
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish latest deb only (no description)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.3.0"
          deb="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          deb_name="$(basename "$deb")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" --clobber
            gh release edit "$tag" --notes ""
          else
            gh release create "$tag" "$deb" \
              --target "$GITHUB_SHA" \
              --title "SlideyDock16 v1.3.0 — iOS 16 rootless" \
              --notes ""
          fi

          # Remove any extra assets (such as older .deb files or checksums)
          # from the active release: just one installable deb remains.
          while IFS= read -r asset; do
            if [[ -n "$asset" && "$asset" != "$deb_name" ]]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')

          # Retain only the newest SlideyDock16 release and tag.
          while IFS= read -r previous_tag; do
            if [[ -n "$previous_tag" && "$previous_tag" != "$tag" ]]; then
              gh release delete "$previous_tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          # Existing release may have been created by an older workflow.
          gh release edit "$tag" --notes ""
